<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redbank Live Weather Station</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }
        header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .widget-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            padding: 1rem;
            border: 1px solid #e5e7eb;
        }
        iframe {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
        }
        footer {
            background-color: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Redbank Live Weather Station</h1>
        <p>Real-time environmental telemetry broadcasting live from Redbank, Victoria</p>
    </header>

    <main>
        <div class="widget-container">
            <!-- REPLACE THE ID BELOW WITH YOUR ACTUAL WEATHERCLOUD ID -->
            <iframe src="https://app.weathercloud.net/d3114488778"></iframe>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Redbank Weather Station &bull; Powered by VEVOR 7-in-1 Hardware</p>
    </footer>

</body>
</html>
<!-- Station Battery Telemetry Block -->
<div id="station-power-monitor" style="margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
    <h3 style="margin-top: 0;">Weather Station System Health</h3>
    <p>Battery State of Charge: <strong id="mkove-soc">Loading...</strong></p>
    <p>System Voltage: <strong id="mkove-voltage">Loading...</strong></p>
    <p style="font-size: 0.8em; color: #666;">Last Updated: <span id="mkove-updated">--:--</span></p>
</div>
<script>
async function loadMkoveTelemetry() {
    // Replace with your actual Mkove Device/Remote ID
    const mkoveRemoteId = 'um5o5xUA'; 
    const apiEndpoint = `https://mkove.com{mkoveRemoteId}`;

    try {
        const response = await fetch(apiEndpoint);
        if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
        }
        
        const telemetry = await response.json();
        
        // Update DOM elements matching your data schema
        // Note: adjust the object keys (.soc, .voltage) to match your specific Mkove payload structure
        document.getElementById('mkove-soc').innerText = (telemetry.soc ?? 'N/A') + '%';
        document.getElementById('mkove-voltage').innerText = (telemetry.voltage ?? 'N/A') + ' V';
        
        const now = new Date();
        document.getElementById('mkove-updated').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
    } catch (error) {
        console.error('Failed to grab live Mkove stats:', error);
        document.getElementById('mkove-soc').innerText = 'Offline';
        document.getElementById('mkove-voltage').innerText = 'Offline';
    }
}

// Execute the call on page render
document.addEventListener('DOMContentLoaded', loadMkoveTelemetry);
</script>
