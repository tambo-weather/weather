<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redbank Live Weather Station</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }
        header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            flex: 1;
            max-width: 1300px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            box-sizing: border-box;
        }
        /* Grid system to position weather elements next to device stats */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            width: 100%;
        }
        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        .widget-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        iframe {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
            border-radius: 8px;
        }
        footer {
            background-color: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Redbank Live Weather Station</h1>
        <p>Real-time environmental telemetry broadcasting live from Redbank, Victoria</p>
    </header>

    <main>
        <div class="dashboard-grid">
            
            <!-- LEFT PANEL: Fully Operational Weathercloud Applet -->
            <div class="widget-container">
                <iframe src="https://weathercloud.net"></iframe>
            </div>

            <!-- RIGHT PANEL: CORS-Proof Direct Mkove Remote Hub View -->
            <div class="widget-container">
                <iframe src="https://mkovedata.com"></iframe>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Redbank Weather Station &bull; Powered by VEVOR 7-in-1 Hardware</p>
    </footer>

</body>
</html>
