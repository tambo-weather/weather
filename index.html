<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redbank Live Weather Station</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }
        header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .widget-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            padding: 1rem;
            border: 1px solid #e5e7eb;
        }
        iframe {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
        }
        footer {
            background-color: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Redbank Live Weather Station</h1>
        <p>Real-time environmental telemetry broadcasting live from Redbank, Victoria</p>
    </header>

    <main>
        <div class="widget-container">
            <!-- REPLACE THE ID BELOW WITH YOUR ACTUAL WEATHERCLOUD ID -->
            <iframe src="https://app.weathercloud.net/d3114488778"></iframe>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Redbank Weather Station &bull; Powered by VEVOR 7-in-1 Hardware</p>
    </footer>

</body>
</html>
