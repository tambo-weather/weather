<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redbank Live Weather Station</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }
        header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .widget-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            margin-bottom: 2rem;
        }
        iframe {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
        }
        .system-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }
        .system-card h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #1e3a8a;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 0.5rem;
        }
        .metric-group {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
        }
        .metric {
            flex: 1;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }
        .metric span {
            display: block;
            font-size: 0.9rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric strong {
            display: block;
            font-size: 1.8rem;
            color: #0f172a;
            margin-top: 0.25rem;
        }
        .timestamp {
            font-size: 0.8rem;
            color: #64748b;
            margin: 0;
            text-align: right;
        }
        footer {
            background-color: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Redbank Live Weather Station</h1>
        <p>Real-time environmental telemetry broadcasting live from Redbank, Victoria</p>
    </header>

    <main>
        <!-- Weathercloud Dashboard Component -->
        <div class="widget-container">
            <iframe src="https://weathercloud.net"></iframe>
        </div>

        <!-- Integrated Station Battery Telemetry Block -->
        <div class="system-card" id="station-power-monitor">
            <h2>Weather Station System Health</h2>
            <div class="metric-group">
                <div class="metric">
                    <span>Battery State of Charge</span>
                    <strong id="mkove-soc">Loading...</strong>
                </div>
                <div class="metric">
                    <span>System Voltage</span>
                    <strong id="mkove-voltage">Loading...</strong>
                </div>
            </div>
            <p class="timestamp">Last Updated: <span id="mkove-updated">--:--</span></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Redbank Weather Station &bull; Powered by VEVOR 7-in-1 Hardware</p>
    </footer>

    <!-- Operational Data Ingestion Script -->
    <script>
    async function loadMkoveTelemetry() {
        const mkoveRemoteId = 'um5o5xUA';
        // Base telemetry address passing safely through a CORS request proxy
        const targetUrl = `https://remote.mkovedata.com/api/device/${mkoveRemoteId}`;
        const apiEndpoint = `https://allorigins.win{encodeURIComponent(targetUrl)}`;

        try {
            const response = await fetch(apiEndpoint);
            if (!response.ok) throw new Error(`HTTP Transport Error: ${response.status}`);
            
            const wrapper = await response.json();
            if (!wrapper.contents) throw new Error("API content payload empty.");
            
            const telemetry = JSON.parse(wrapper.contents);
            
            // Map parameters directly to your screen text blocks
            document.getElementById('mkove-soc').innerText = (telemetry.soc ?? 'N/A') + '%';
            document.getElementById('mkove-voltage').innerText = (telemetry.voltage ?? 'N/A') + ' V';
            
            const now = new Date();
            document.getElementById('mkove-updated').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
        } catch (error) {
            console.error('Failed to parse active metrics:', error);
            // Fallback status fallback strings if communication errors present themselves
            if (document.getElementById('mkove-soc').innerText === 'Loading...') {
                document.getElementById('mkove-soc').innerText = 'Offline';
                document.getElementById('mkove-voltage').innerText = 'Offline';
            }
        }
    }

    // Initialize execution cycles
    document.addEventListener('DOMContentLoaded', () => {
        loadMkoveTelemetry();
        // Request updates on a repeating 10-second interval cycle
        setInterval(loadMkoveTelemetry, 10000);
    });
    </script>

</body>
</html>
